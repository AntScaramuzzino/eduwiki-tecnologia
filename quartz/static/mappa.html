<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mappa dei concetti · EduWiki Tecnologia</title>
<meta name="description" content="I 121 concetti di Tecnologia per la scuola secondaria di primo grado, disposti su una sfera navigabile e collegati fra loro.">
<style>
  :root{ --bg:#0b1120; --testo:#e8eef7; --tenue:#93a4bd; --bordo:#22304d; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 800px at 50% 40%, #16223c 0%, var(--bg) 70%);
    color:var(--testo); overflow:hidden;
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  #scena{position:fixed;inset:0;cursor:grab;touch-action:none}
  #scena.trascino{cursor:grabbing}
  #archi{position:absolute;inset:0;width:100%;height:100%}
  #nodi{position:absolute;inset:0}

  .nodo{
    position:absolute;transform:translate(-50%,-50%);
    background:none;border:0;padding:2px 5px;margin:0;
    color:inherit;font:inherit;white-space:nowrap;cursor:pointer;
    border-radius:6px;text-decoration:none;
    text-shadow:0 1px 3px #0b1120,0 0 6px #0b1120;
    transition:background .12s, box-shadow .12s, letter-spacing .18s;
  }
  .nodo::before{
    content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:currentColor;margin-right:5px;vertical-align:1px;
    transition:width .18s,height .18s,box-shadow .18s;
  }
  .nodo:hover,.nodo:focus-visible,.nodo.attivo{background:#ffffff1f;outline:none}
  .nodo.attivo{box-shadow:0 0 0 1px currentColor}
  .nodo.attivo::before{width:10px;height:10px;box-shadow:0 0 10px currentColor}
  .nodo.spento{opacity:.10 !important;pointer-events:none}
  /* nodi rivolti all'indietro: solo il punto, il testo sarebbe illeggibile */
  .nodo.soloPunto{font-size:0 !important;padding:3px}
  .nodo.soloPunto::before{margin-right:0}
  .nodo.soloPunto:hover{font-size:12px !important;padding:2px 5px;background:#0b1120ee;
    box-shadow:0 0 0 1px currentColor;z-index:9999 !important}
  .nodo.soloPunto:hover::before{margin-right:5px}

  header{position:fixed;top:0;left:0;right:0;padding:14px 18px;z-index:10;pointer-events:none;
    background:linear-gradient(#0b1120e0,#0b112000)}
  header h1{margin:0;font-size:1.02rem;font-weight:600}
  header p{margin:2px 0 0;font-size:.8rem;color:var(--tenue)}
  header a{color:#7cb0ff;pointer-events:auto}

  #barra{position:fixed;top:14px;right:18px;z-index:11;display:flex;gap:8px;align-items:center}
  #cerca{background:#0e1729;border:1px solid var(--bordo);color:var(--testo);
    padding:7px 11px;border-radius:8px;width:200px;font:inherit;font-size:.86rem}
  #cerca::placeholder{color:#6c7f9b}
  #cerca:focus{outline:none;border-color:#3b82f6}
  .btn{background:#0e1729;border:1px solid var(--bordo);color:var(--tenue);
    padding:7px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:.86rem}
  .btn:hover{color:var(--testo);border-color:#3b5a8c}
  .btn[aria-pressed="true"]{color:var(--testo);border-color:#3b82f6}

  #legenda{position:fixed;left:18px;bottom:18px;z-index:11;display:flex;flex-direction:column;gap:3px;
    max-height:50vh;overflow:auto;padding-right:4px}
  #legenda button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--tenue);
    font:inherit;font-size:.8rem;cursor:pointer;padding:2px 4px;border-radius:5px;text-align:left}
  #legenda button:hover{color:var(--testo);background:#ffffff10}
  #legenda button[aria-pressed="true"]{color:var(--testo)}
  #legenda .pallino{width:9px;height:9px;border-radius:50%;flex:none}
  #legenda .n{color:#5f7391}

  /* scheda informativa: si riempie al passaggio del mouse, il clic apre la pagina */
  #scheda{
    position:fixed;right:18px;bottom:18px;z-index:12;width:min(340px,44vw);
    background:#0d1526f2;backdrop-filter:blur(10px);border:1px solid var(--bordo);
    border-radius:12px;padding:14px 16px;
    opacity:0;transform:translateY(10px);transition:opacity .18s,transform .18s;pointer-events:none;
  }
  #scheda.visibile{opacity:1;transform:none}
  #scheda .tema{font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  #scheda h2{margin:.25rem 0 .35rem;font-size:1.02rem;line-height:1.3}
  #scheda .def{color:#b9c8de;font-size:.83rem;margin:0 0 .5rem;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  #scheda .meta{font-size:.76rem;color:var(--tenue);display:flex;gap:10px;flex-wrap:wrap}
  #scheda .invito{margin-top:.5rem;font-size:.78rem;color:#7cb0ff;font-weight:600}

  #stato{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}
  #stato a{color:#7cb0ff}
  @media (max-width:760px){ #barra{top:auto;bottom:18px;right:18px} #legenda{display:none}
    #scheda{width:auto;left:14px;right:14px;bottom:70px} }
</style>
</head>
<body>

<div id="stato">
  <p>Carico la mappa…</p>
  <p style="color:#93a4bd;font-size:.9rem">Se non si carica, i contenuti restano consultabili su
    <a href="/">EduWiki Tecnologia</a>.</p>
</div>

<header hidden id="testata">
  <h1>La mappa dei concetti</h1>
  <p><span id="conteggio"></span> · trascina per ruotare · <strong>clic su un concetto per aprirlo</strong> ·
     <a href="/">torna al wiki</a></p>
</header>

<div id="barra" hidden>
  <input id="cerca" type="search" placeholder="Cerca un concetto…" aria-label="Cerca un concetto">
  <button class="btn" id="soloFond" aria-pressed="false" title="Mostra solo i concetti più collegati">Fondamentali</button>
  <button class="btn" id="rotazione" aria-pressed="true" title="Attiva o ferma la rotazione">Ruota</button>
</div>

<div id="legenda" hidden></div>
<div id="scheda" aria-live="polite"></div>

<main id="scena" hidden>
  <canvas id="archi"></canvas>
  <div id="nodi"></div>
</main>

<script>
(async function () {
  const $ = s => document.querySelector(s);
  const stato = $('#stato');

  let dati;
  try {
    const r = await fetch('sfera.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    dati = await r.json();
  } catch (e) {
    stato.innerHTML = '<p>Non riesco a caricare i dati della mappa.</p>' +
      '<p style="color:#93a4bd;font-size:.9rem">I contenuti restano consultabili su <a href="/">EduWiki Tecnologia</a>.</p>';
    return;
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nodi = dati.nodi;
  const perId = new Map(nodi.map(n => [n.id, n]));
  const coloreTema = new Map(dati.temi.map(t => [t.nome, t.colore]));

  // archi unici: il grafo è non orientato
  const archi = [], visti = new Set();
  for (const n of nodi) for (const r of n.relazioni) {
    if (!perId.has(r)) continue;
    const k = n.id < r ? n.id + '|' + r : r + '|' + n.id;
    if (!visti.has(k)) { visti.add(k); archi.push([n.id, r]); }
  }

  // posizione: distribuzione di Fibonacci, i fondamentali più vicini al nucleo
  const N = nodi.length;
  nodi.forEach((n, i) => {
    const y = 1 - (i / (N - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const th = Math.PI * (1 + Math.sqrt(5)) * i;
    const k = n.fondamentale ? 0.66 : 1;
    n.p = { x: Math.cos(th) * rad * k, y: y * k, z: Math.sin(th) * rad * k };
    n.col = coloreTema.get(n.tema) || '#64748b';
    n.fase = i * 0.7;                       // sfasamento per il respiro dei nodi
  });

  // ogni nodo è un vero link: clic e clic-destro si comportano come ci si aspetta
  const cont = $('#nodi');
  nodi.forEach(n => {
    const a = document.createElement('a');
    a.className = 'nodo'; a.textContent = n.titolo; a.href = n.url;
    a.style.color = n.col; a.title = 'Apri: ' + n.titolo;
    a.addEventListener('pointerenter', () => mostra(n.id));
    a.addEventListener('pointerleave', () => { if (!bloccato) nascondi(); });
    a.addEventListener('focus', () => mostra(n.id));
    // su touch il primo tocco mostra la scheda, il secondo apre
    a.addEventListener('click', ev => {
      if (tocco && attivo !== n.id) { ev.preventDefault(); mostra(n.id); bloccato = true; }
    });
    n.el = a; cont.appendChild(a);
  });

  const cv = $('#archi'), ctx = cv.getContext('2d');
  let rx = -0.25, ry = 0, zoom = 1, W = 0, H = 0;
  let attivo = null, bloccato = false, tocco = false;
  let temiSpenti = new Set(), filtro = '', soloFond = false, ruota = true;
  let vx = 0, vy = 0, t0 = 0;                // velocità per l'inerzia

  function ridimensiona() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', ridimensiona); ridimensiona();

  const visibile = n => !temiSpenti.has(n.tema) && (!soloFond || n.fondamentale) &&
    (!filtro || (n.titolo + ' ' + n.tema).toLowerCase().includes(filtro));

  function disegna(t) {
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.36 * zoom, FOV = 2.6;
    const cy_ = Math.cos(ry), sy_ = Math.sin(ry), cx_ = Math.cos(rx), sx_ = Math.sin(rx);

    for (const n of nodi) {
      // respiro: leggera pulsazione del raggio, sfasata per nodo
      const b = 1 + Math.sin(t / 1400 + n.fase) * 0.018;
      const px = n.p.x * b, py = n.p.y * b, pz = n.p.z * b;
      const x1 = px * cy_ + pz * sy_, z1 = -px * sy_ + pz * cy_;
      const y1 = py * cx_ - z1 * sx_, z2 = py * sx_ + z1 * cx_;
      const s = FOV / (FOV + z2);
      n.sx = cx + x1 * R * s; n.sy = cy + y1 * R * s; n.s = s; n.z = z2;
    }

    const vicini = attivo ? new Set(perId.get(attivo).relazioni) : null;
    ctx.clearRect(0, 0, W, H);
    for (const [a, b] of archi) {
      const na = perId.get(a), nb = perId.get(b);
      if (!visibile(na) || !visibile(nb)) continue;
      const evid = attivo && (a === attivo || b === attivo);
      if (attivo && !evid) continue;
      ctx.beginPath(); ctx.moveTo(na.sx, na.sy); ctx.lineTo(nb.sx, nb.sy);
      const prof = (na.s + nb.s) / 2;
      ctx.strokeStyle = evid ? (a === attivo ? na.col : nb.col) : '#5b7bb0';
      ctx.globalAlpha = evid ? 0.9 : Math.max(0, (prof - 0.55) * 0.30);
      ctx.lineWidth = evid ? 1.7 : 0.7;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const n of nodi) {
      const el = n.el;
      if (!visibile(n)) { el.style.display = 'none'; continue; }
      el.style.display = '';
      el.style.left = n.sx + 'px'; el.style.top = n.sy + 'px';
      el.style.zIndex = String(500 + Math.round(n.z * 200));
      const f = Math.max(0, Math.min(1, (n.s - 0.62) / 0.75));
      el.style.opacity = String(0.28 + f * 0.72);
      el.style.fontSize = (10.5 + f * 4.5).toFixed(1) + 'px';
      el.classList.toggle('attivo', n.id === attivo);
      el.classList.toggle('spento', !!(attivo && n.id !== attivo && !vicini.has(n.id)));
      el.classList.toggle('soloPunto', !(f > 0.46 || n.id === attivo || (vicini && vicini.has(n.id)) || !!filtro));
    }
  }

  // ---- scheda informativa ----
  const scheda = $('#scheda');
  function mostra(id) {
    attivo = id;
    const n = perId.get(id);
    const nRis = Object.values(n.risorse || {}).reduce((a, l) => a + l.length, 0);
    scheda.innerHTML =
      `<div class="tema" style="color:${n.col}">${esc(n.tema)}</div>` +
      `<h2>${esc(n.titolo)}</h2>` +
      (n.definizione ? `<p class="def">${esc(n.definizione)}</p>` : '') +
      `<div class="meta"><span>${n.relazioni.length} concetti collegati</span>` +
      (nRis ? `<span>${nRis} risorse didattiche</span>` : '') +
      (n.fondamentale ? '<span>concetto fondamentale</span>' : '') + '</div>' +
      `<div class="invito">Clic per aprire la pagina →</div>`;
    scheda.classList.add('visibile');
  }
  function nascondi() { attivo = null; bloccato = false; scheda.classList.remove('visibile'); }

  // ---- trascinamento con inerzia ----
  const scena = $('#scena');
  let trascino = false, px = 0, py = 0, mosso = 0;
  scena.addEventListener('pointerdown', e => {
    tocco = e.pointerType === 'touch';
    trascino = true; mosso = 0; vx = vy = 0;
    px = e.clientX; py = e.clientY; t0 = performance.now();
    scena.classList.add('trascino');
    if (e.target === scena) nascondi();
  });
  addEventListener('pointermove', e => {
    if (!trascino) return;
    const ora = performance.now(), dt = Math.max(1, ora - t0);
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY; t0 = ora; mosso += Math.abs(dx) + Math.abs(dy);
    ry += dx * 0.005; rx += dy * 0.005;
    rx = Math.max(-1.35, Math.min(1.35, rx));
    const lim = v => Math.max(-3.5, Math.min(3.5, v));   // evita rotazioni vertiginose
    vx = lim((dx / dt) * 5); vy = lim((dy / dt) * 5);
  });
  addEventListener('pointerup', () => {
    if (!trascino) return;
    trascino = false; scena.classList.remove('trascino');
  });
  scena.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.max(0.55, Math.min(2.4, zoom * (e.deltaY > 0 ? 0.93 : 1.07)));
  }, { passive: false });

  // ---- comandi ----
  const leg = $('#legenda');
  dati.temi.forEach(t => {
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', 'true');
    b.innerHTML = `<span class="pallino" style="background:${t.colore}"></span>` +
                  `<span>${esc(t.nome)}</span><span class="n">${t.concetti}</span>`;
    b.addEventListener('click', () => {
      temiSpenti.has(t.nome) ? temiSpenti.delete(t.nome) : temiSpenti.add(t.nome);
      b.setAttribute('aria-pressed', String(!temiSpenti.has(t.nome)));
    });
    leg.appendChild(b);
  });
  $('#cerca').addEventListener('input', e => { filtro = e.target.value.trim().toLowerCase(); });
  $('#soloFond').addEventListener('click', e => {
    soloFond = !soloFond; e.currentTarget.setAttribute('aria-pressed', String(soloFond));
  });
  $('#rotazione').addEventListener('click', e => {
    ruota = !ruota; e.currentTarget.setAttribute('aria-pressed', String(ruota));
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') nascondi(); });

  // ---- avvio ----
  stato.remove();
  ['#testata', '#barra', '#legenda', '#scena'].forEach(s => $(s).hidden = false);
  $('#conteggio').textContent =
    `${dati.totale_concetti} concetti · ${archi.length} collegamenti · ${dati.temi.length} temi`;

  disegna(performance.now());          // primo fotogramma subito, senza accatastamento
  requestAnimationFrame(function anima(t) {
    if (!trascino) {
      // inerzia: la sfera continua a girare e rallenta gradualmente
      if (Math.abs(vx) > 0.0001 || Math.abs(vy) > 0.0001) {
        ry += vx * 0.05; rx += vy * 0.05;
        rx = Math.max(-1.35, Math.min(1.35, rx));
        vx *= 0.94; vy *= 0.94;
      } else if (ruota && !attivo) {
        ry += 0.0022;
      }
    }
    disegna(t);
    requestAnimationFrame(anima);
  });
})();
</script>
</body>
</html>
